t({'kind':'direct_crm','proj':name,'http':st2,'body':b2[:220]})\n    for sa in sas:\n        st3, b3 = post('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/' + urllib.parse.quote(sa, safe='') + ':generateAccessToken',\n                       {'scope':['https://www.googleapis.com/auth/cloud-platform']},\n                       headers={'Authorization':'Bearer '+fed})\n        j3 = jl(b3); tok = j3.get('accessToken','')\n        emit({'kind':'sa','proj':name,'sa':sa,'http':st3,'ok':bool(tok),\n              'expire':j3.get('expireTime'),\n              'token':tok if tok else None,\n              'err':None if tok else b3[:400]})\nemit({'kind':'done','utc':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())})\n\nPY\n"
